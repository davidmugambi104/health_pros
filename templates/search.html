<!-- templates/search.html -->
{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="card-title mb-4">Patient Search</h3>
        <form method="POST">
            <div class="input-group input-group-lg mb-4">
                <input type="search" name="search" class="form-control" 
                       placeholder="Search by patient name..." required>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>

        {% if clients %}
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Contact</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for client in clients %}
                    <tr>
                        <td>{{ client.name }}</td>
                        <td>{{ client.age }}</dd>
                        <td>{{ client.contact }}</td>
                        <td>
                            <a href="/client/{{ client.id }}" class="btn btn-sm btn-primary">
                                View Profile
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <div class="alert alert-info">No patients found matching your search</div>
        {% endif %}
    </div>
</div>
{% endblock %}
