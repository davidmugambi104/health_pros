<!-- templates/index.html -->
{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center text-white" style="margin-top: 15vh">
            <h1 class="display-4 mb-4">Welcome to Auth System</h1>
            <p class="lead mb-5">Secure authentication system with modern UI</p>
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                <a href="{{ url_for('signup') }}" class="btn btn-primary btn-lg px-4">
                    <i class="fas fa-user-plus me-2"></i>Sign Up
                </a>
                <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-lg px-4">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
